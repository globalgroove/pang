<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- =====================================================================
     WORK PAGE  (work/index.html)
     CONTENT BLOCK  -  THIS IS THE ONLY PART YOU NEED TO EDIT HERE
     =====================================================================
     The tables are built from "projects" and "commercial" in assets/site.js.
     To add a project, add it there, not here.
     ===================================================================== -->
<script>
const PAGE = {

  root: "../",                   // path back to the site root (one folder down)

  browserTitle: "Work — pang",
  sideTab: "WORK",               // text in the black box on the right edge. "" hides it
  heading: "Work",               // hidden heading, for screen readers

  /* column headings of the lists */
  columns:           { title: "Title", artist: "Artist", role: "Role", year: "Year" },
  commercialColumns: { title: "Title", client: "Client", role: "Role", year: "Year" },

  /* labels of the details under the image, in this order */
  labels: { title: "Title", artist: "Artist", client: "Client", brand: "End client", role: "Role", format: "Format", year: "Year", premiere: "Premiere" },

  forLabel: "for",              // Commercial table: the word before the end client, under the client
  previewLabel: "Open",          // link under the details, for projects with a page
  soonLabel: "Page in preparation",   // shown instead, for projects without a page yet
};
</script>
<!-- ===================== END OF CONTENT BLOCK ===================== -->

<title>Work — pang</title>
<link rel="icon" type="image/png" href="../id/favicon.png">
<link rel="apple-touch-icon" href="../id/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/list.css">
<script src="../assets/site.js"></script>
<style>
/* work page only: portrait frame, the same list type as Discography (assets/list.css) */
:root{--frame-ratio:4/5}
.cols{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
td.a{font-weight:400}          /* artist regular, title medium, as on Discography */
td.role{white-space:nowrap}
td .l2{display:block;margin-top:2px;font:400 calc(var(--list-size) - 1px)/1.4 var(--list-sans);opacity:.7}
/* both tables share the same column widths, so the Commercial list lines up under the projects */
main table{table-layout:fixed}
main th:nth-child(1),main td:nth-child(1){width:30%}
main th:nth-child(2),main td:nth-child(2){width:28%}
main th:nth-child(4),main td:nth-child(4){width:5.5em}
@media (max-width:760px){main th:nth-child(1),main td:nth-child(1){width:auto}main th:nth-child(2),main td:nth-child(2){width:38%}}
.p-specs dd.n{font-family:var(--list-sans)}
.p-specs dd.t{font-weight:500}
.p-specs{margin-bottom:10px}
/* the Commercial table: its own heading, a gap above it */
table.second{margin-top:36px}
caption.sec{caption-side:top;text-align:left;padding:0 8px 10px;font:500 calc(var(--list-size) + 1px)/1.3 var(--list-sans);letter-spacing:.16em;text-transform:uppercase}
#rows-com:not(:hover) tr.on:not(:focus-within){background:none;color:inherit}
#rows-com:not(:hover) tr.on:not(:focus-within) td{border-bottom-color:var(--row-line)}
#rows-com:not(:hover) tr.soon.on:not(:focus-within) td{opacity:.75}
@media (max-width:760px){.cols{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="page" id="top">

  <nav class="site" id="site"></nav>
  <div class="tabs-side" id="tabs-side"><div class="tab-side" id="tab-side" aria-hidden="true"></div></div>

  <!-- two columns: preview panel on the left, project lists on the right -->
  <div class="cols">
    <aside class="preview" id="preview" aria-live="polite">
      <div class="frame"><img id="p-img" alt=""></div>
      <div class="body">
        <dl class="p-specs" id="p-specs"></dl>
        <a class="ql" id="p-open"></a>
        <span class="p-soon" id="p-soon"></span>
      </div>
    </aside>
    <main>
      <h1 class="sr" id="h1"></h1>
      <table id="t-main">
        <thead><tr><th scope="col" class="h-title"></th><th scope="col" class="h-artist"></th><th scope="col" class="h-role wide"></th><th scope="col" class="h-year"></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <table class="second" id="t-com" hidden>
        <caption class="sec" id="h-com"></caption>
        <thead><tr><th scope="col" class="c-title"></th><th scope="col" class="c-client"></th><th scope="col" class="c-role wide"></th><th scope="col" class="c-year"></th></tr></thead>
        <tbody id="rows-com"></tbody>
      </table>
    </main>
  </div>
</div>

<script src="../assets/base.js"></script>
<!-- WORK PAGE BUILDER. Reads "projects" and "commercial" in assets/site.js. No need to edit. -->
<script>
(function(){
  try {
    var C = PAGE, root = C.root || '', S = (typeof SITE !== 'undefined') ? SITE : {}, L = C.labels;
    function $(id){ return document.getElementById(id); }
    function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

    document.title = C.browserTitle;
    $('h1').textContent = C.heading;
    if (C.sideTab) $('tab-side').textContent = C.sideTab;
    else { $('tabs-side').remove(); document.querySelector('.page').classList.add('no-tabs'); }
    $('p-open').textContent = C.previewLabel + ' →';
    $('p-soon').textContent = C.soonLabel || '';
    function heads(prefix, cols){ Object.keys(cols).forEach(function(k){ [].forEach.call(document.querySelectorAll('.' + prefix + k), function(th){ th.textContent = cols[k]; }); }); }
    heads('h-', C.columns); heads('c-', C.commercialColumns);

    // preview image: loaded in the background and shown only once it has loaded (a missing file keeps the dotted frame)
    var img = $('p-img'), want = '', cache = {};
    img.hidden = true;
    function setImage(src, alt){
      want = src; img.hidden = true;
      if (!src || cache[src] === false) return;
      var put = function(){ if (want === src) { img.src = src; img.alt = alt; img.hidden = false; } };
      if (cache[src] === true) return put();
      var probe = new Image();
      probe.onload = function(){ cache[src] = true; put(); };
      probe.onerror = function(){ cache[src] = false; };
      probe.src = src;
    }

    var bodies = [$('rows'), $('rows-com')];
    function show(p, tr){
      bodies.forEach(function(b){ [].forEach.call(b.children, function(r){ r.classList.toggle('on', r === tr); }); });
      setImage(p.image ? root + p.image : '', p.title);
      // sheet: Title, Artist (or Client and Brand), Role, Format, Year, Premiere (names in the sans, the rest in the mono)
      var dl = $('p-specs'); dl.textContent = '';
      [['title', p.title, 'n t'], ['artist', p.artist, 'n'], ['client', p.client, 'n'], ['brand', p.brand, 'n'], ['role', p.role], ['format', p.format], ['year', p.year], ['premiere', p.premiere]].forEach(function(f){
        if (!f[1]) return;
        dl.appendChild(el('dt', null, L[f[0]])); dl.appendChild(el('dd', f[2] || null, f[1]));
      });
      $('p-open').hidden = !p.link; $('p-soon').hidden = !!p.link;
      if (p.link) $('p-open').href = root + p.link;
    }

    // one row per project: with a page the title is a link covering the row; without, plain text and the row only previews
    function rows(list, body){
      list.forEach(function(p){
        var tr = el('tr', p.link ? null : 'soon'), t = el('td', 't'), a = el(p.link ? 'a' : 'span', null, p.title);
        if (p.link) a.href = root + p.link; else { tr.tabIndex = 0; tr.addEventListener('focus', function(){ show(p, tr); }); }
        t.appendChild(a);
        if (p.role) t.appendChild(el('span', 'sub', p.role));      // the role under the title, on phones only
        tr.appendChild(t);
        var who = el('td', 'a', p.artist || p.client || '—');              // projects: the artist. Commercial: the client,
        if (p.brand) who.appendChild(el('span', 'l2', (C.forLabel || 'for') + ' ' + p.brand));   // with the end client small underneath
        tr.appendChild(who);
        tr.appendChild(el('td', 'role wide', p.role || '—'));      // hidden on phones, where it moves under the title
        tr.appendChild(el('td', 'yr', p.year || '—'));
        tr.addEventListener('mouseenter', function(){ show(p, tr); });
        a.addEventListener('focus', function(){ show(p, tr); });
        body.appendChild(tr);
      });
    }
    var main = S.projects || [], com = S.commercial || [], all = main.concat(com);
    if (!all.length) { $('preview').hidden = true; return; }
    if (main.length) rows(main, $('rows')); else $('t-main').hidden = true;
    if (com.length) {
      $('h-com').textContent = S.commercialHeading || 'Commercial';
      $('t-com').hidden = false;
      rows(com, $('rows-com'));
    }

    // once the page has loaded, fetch every preview image quietly in the background, so hovering shows it at once
    window.addEventListener('load', function(){
      all.forEach(function(x){
        if (!x.image) return;
        var src = root + x.image;
        if (src in cache) return;
        var pre = new Image();
        pre.onload = function(){ cache[src] = true; };
        pre.onerror = function(){ cache[src] = false; };
        pre.src = src;
      });
    });
    if (main.length) show(main[0], $('rows').firstChild); else show(com[0], $('rows-com').firstChild);
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', '<p style="padding:12px;font:14px monospace">Content error: check the quotation marks and commas in assets/site.js.</p>');
  }
})();
</script>
<script src="../assets/list-mobile.js"></script>
</body>
</html>
