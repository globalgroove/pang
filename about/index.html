<!-- =====================================================================
     ABOUT PAGE  (about/index.html)
     CONTENT BLOCK  -  THIS IS THE ONLY PART YOU NEED TO EDIT HERE
     =====================================================================
     Left: the dark panel with an optional square image, the hovered contact, short text and info lines.
     Right: the contact list (from "contact" in assets/site.js), then one table per section (Services, CV ...). Add, remove or reorder
     sections freely; each row is a list of cells, one per column.

     Rules:
       - Keep the quotation marks "like this" and the commas at line ends.
       - A quotation mark inside a value needs a backslash: "12\" LP"
       - Paragraphs may contain simple HTML, e.g. <em>italic</em>.

         the column after it is the title column (medium weight).

  copiedLabel: "Copied",
  writeLabel: "Write",           // email only: opens the visitor's mail app
  openLabel: "Open",             // other channels: opens the page in a new tab

                                 // e.g. "id/about.jpg". "" = dotted placeholder. Set showImage: false to drop the frame
  imageOnPaper: false,            // true = the image sits whole on the page colour, with a thin outline
                                 // (for drawings with a transparent background); false = it fills the frame
  showImage: true,

  /* ---- PANEL TEXT: list of paragraphs, [] hides it ------------------ */
  text: [],

  /* ---- PANEL INFO LINES:  [ "label", "value" ]. [] hides them -------- */
  info: [
    ["Based in", ""],
    ["Languages", ""]
  ],

  /* ---- SECTIONS (right column) --------------------------------------- */
  /*   heading : small title above the table                             */
  /*   columns : column headings, left to right                          */
  /*   showColumns : false hides the column headings of that table       */
  /*   rows    : one [ ... ] per line, same number of cells as columns   */
  /*   a cell can be "text" or [ "first line", "second line" ]: the second */
  /*   line is set smaller underneath (month, author, city, details)      */
  sections: [
    {
      heading: "Services",

    },

        ["2024", ["BOCARRA", "Luísa Saraiva"], ["PACT ZOLLVEREIN", "Essen (DE)"], ["SOUND DIRECTION", "Sound composition, sound design, spatial-audio implementation and live performance"]],
        ["2024", ["BOCARRA", "Luísa Saraiva"], ["LA MANUFACTURE CDCN", "Bordeaux (FR)"], ["SOUND DIRECTION", "Sound composition, sound design, spatial-audio implementation and live performance"]],
        [["2024", "Jul"], ["BOCARRA", "Luísa Saraiva"], ["TEATRO ROSALÍA DE CASTRO", "A Coruña (ES)"], ["RESEARCH", "Residency"]],
        [["2024", "Apr"], ["BOCARRA", "Luísa Saraiva"], ["FESTIVAL DDD", "Porto (PT)"], ["SOUND DIRECTION", "Sound composition, sound design, spatial-audio implementation and live performance"]],
        ["2022", ["TIRANA", "Luísa Saraiva"], ["MUSEU COMO PERFORMANCE", "Fundação de Serralves, Porto (PT)"], ["SOUND DRAMATURGY", "Consultant"]],
        ["2022", ["LAGO LIBIDINAL", "Jonathan Saldanha"], ["CCB", "Lisboa (PT)"], ["SOUND DESIGN & SOFTWARE DEVELOPMENT", "Dramaturgy, software development"]],
        ["2022", ["LAGO LIBIDINAL", "Jonathan Saldanha"], ["RIVOLI, TMP", "Porto (PT)"], ["SOUND DESIGN & SOFTWARE DEVELOPMENT", "Dramaturgy, software development"]],
        [["2021–22", "Aug–May"], ["LAGO LIBIDINAL / SCALE TRAVELS", "Jonathan Saldanha"], ["INDEX FESTIVAL", "Scale Travels collaboration programme, INL & gnration, Braga (PT)"], ["SOUND DESIGN & SOFTWARE DEVELOPMENT", "Software development, 3D modelling and video creation"]],
        ["2021–22", ["LAGO LIBIDINAL", "Jonathan Saldanha"], ["SOOPA", "Porto (PT)"], ["RESEARCH", "Dramaturgy, software development"]],
        ["2021", ["LITHIUM FAUST", "Jonathan Saldanha"], ["TMP", "Porto (PT)"], ["SOUND DESIGN", "Multichannel sound design for a stage piece"]],
        ["2021", ["UBER ALLES", "Carlos Mesquita"], ["BOCA BIENNIAL", "MAAT, Lisboa (PT)"], ["SOUND DESIGN", "Sound composition, live performance"]],
        ["2020", ["MERCÚRIO VERMELHO", "Jonathan Saldanha"], ["TMP", "Porto (PT)"], ["SOUND DESIGN", "Script transcription, artificial voice-over modelling, mixing on location"]]
      ]
    },
    {
      heading: "Exhibitions and commissions",
      columns: ["Year", "Work", "Venue", "Role"],
      rows: [
        [["2026", "Apr–May"], ["REDSKYFALLS", "Alexandre Estrela"], ["VENICE BIENNALE", "61st International Art Exhibition, Venice (IT)"], ["AV INSTALLATION", "Multichannel audio and video implementation"]],
        [["2023", "Dec"], ["WORK", "Co-creation, Diogo Tudela ++"], ["FUNDAÇÃO DE SERRALVES", "Porto (PT)"], ["CO-AUTHOR", "Sound piece. Created by Diogo Tudela with Dinis Duarte, Juan Toboso, Marcelo Reis, Maria Coutinho, Ricardo Jacinto"]],
        ["2022", ["WATERS’ WITNESS", "Tarek Atoui"], ["FUNDAÇÃO DE SERRALVES", "Porto (PT)"], ["COMMISSION", "Activation of the exhibition, performed live with Mariana Sardon"]],
        ["2022", ["W&T SOUNDSYSTEM", "Co-creation with Sérgio Coutinho"], ["FESTIVAL WALK&TALK", "São Miguel, Azores (PT)"], ["COMMISSION / ENGINEERING", "Custom sound system: design, build and implementation"]],
        ["2020", ["UNTITLED", "Berru"], ["ARTWORKS — NO ENTULHO", "Residency, Porto (PT)"], ["CO-AUTHOR", "Dramaturgy, sound consultancy, electroacoustic instrument design and live performance"]]
      ]
    },
    {
      heading: "Own work and co-creation",
      columns: ["Year", "Work", "Venue", "Role"],
      rows: [
        [["2023", "Feb"], ["PERMAFROST", "Creation, with Diogo Oliveira"], ["ESCOLA DAS ARTES, UCP", "Porto (PT)"], ["LIVE AV", "AV installation, live show"]],
        ["2022", ["C-PENTANE", "Creation"], ["BERLINER FESTSPIELE, MAERZMUSIK", "Silent Green, Berlin (DE)"], ["COMMISSION", "Sound piece, live presentation"]],
        [["2022", "Oct"], ["ADAMASTORA", "Creation, with Mauro Ventura"], ["FABBRICA DEL VAPORE", "Milan (IT)"], ["SOUND COMPOSITION", "Programmed by Hyper Objects. AV installation, live performance"]],
        [["2022", "Aug"], ["PERMAFROST", "Creation, with Diogo Oliveira"], ["PAF", "Saint-Erme (FR)"], ["SHOW, LECTURE", "PAF Summer School programme. AV installation, live performance"]],
        ["2019", ["MÁXIMA INTRÍNSECA", "Co-creation with Mariana Vilanova"], ["PLANETÁRIO DO PORTO", "Porto (PT)"], ["LIVE AV", "Live show"]]
      ]
    }
  ]
};
</script>

<title>About — pang</title>
<link rel="icon" type="image/png" href="../id/favicon.png">
<link rel="apple-touch-icon" href="../id/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/list.css">
<script src="../assets/site.js"></script>
<style>
/* about page only: square frame, narrower panel, wider list. Type comes from assets/list.css */
:root{--frame-ratio:1/1}
.cols{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
/* the section tables are for reading: no pointer, no highlighted rows */
tbody tr{cursor:default}
table.read tbody tr:hover,table.read tbody tr:focus-within{background:none;color:inherit}
table.read tbody tr:hover td,table.read tbody tr:focus-within td{border-bottom-color:var(--row-line)}
/* contact list: channel | address, as on the old Contact page */
#c-specs dd{user-select:all;-webkit-user-select:all;word-break:break-all}   /* one click selects the whole address */
#c-specs dd.act,#c-specs dd.c-note{user-select:auto;-webkit-user-select:auto}
.preview .frame.paper{aspect-ratio:3/2;background:var(--paper);box-shadow:inset 0 0 0 1px var(--accent)}   /* wider frame for the drawing */
.preview .frame.paper img{object-fit:contain;padding:9% 7%;background:transparent}
.acts{display:flex;gap:16px;margin:0 0 4px}
.acts button.ql{background:none;border:0;padding:0;color:inherit;cursor:pointer}
.c-note{font:400 var(--list-size)/1.5 var(--list-sans);opacity:.75}
table + table{margin-top:36px}
/* wide screens: Services and the CV scroll in their own block beside the panel, the page stays still */
@media (min-width:761px){
  #sections{max-height:calc(100vh - 110px);overflow-y:auto;overscroll-behavior:contain;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
  #sections::-webkit-scrollbar{width:6px}
  #sections::-webkit-scrollbar-thumb{background:var(--rule)}
}
/* section title above each table, in the face of the Discography and Work headings */
caption.sec{caption-side:top;text-align:left;padding:0 8px 10px;font:500 calc(var(--list-size) + 1px)/1.3 var(--list-sans);letter-spacing:.16em;text-transform:uppercase}
thead th{opacity:.55}
td.t{width:16em}
table.read:not(.cv) td.t{width:19em;white-space:nowrap}   /* Services: names on one line, the second column lined up */
/* CV tables: four columns, a smaller second line under each value */
td .l2{display:block;margin-top:2px;font:400 calc(var(--list-size) - 1px)/1.4 var(--list-sans);letter-spacing:0;opacity:.7}
td.yr .l2{font-family:var(--list-mono)}
table.cv td.t{width:26%}
table.cv td:nth-child(3){width:28%}
table.cv td.yr{width:5.5em}
td .l2.venue{display:none}
/* phones: one column; the panel stays, above the tables */
@media (max-width:760px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .preview{display:block;position:static;margin-bottom:28px;max-width:420px}
  td.t{width:auto}
  table.read:not(.cv) td.t{width:auto;white-space:normal}
  table.cv td.t,table.cv td:nth-child(3){width:auto}
  table.cv td:nth-child(3){display:none}            /* phones: venue moves under the title */
  table.cv thead th:nth-child(3){display:none}
  td .l2.venue{display:block}
}
</style>
</head>
<body>
<div class="page" id="top">

  <nav class="site" id="site"></nav>
  <div class="tabs-side" id="tabs-side"><div class="tab-side" id="tab-side" aria-hidden="true"></div></div>

  <!-- two columns: panel on the left, sections on the right -->
  <div class="cols">
    <aside class="preview" id="preview">
      <div class="frame" id="frame"><img id="p-img" alt=""></div>
      <div class="body">
        <dl class="p-specs" id="c-specs"></dl>
        <div id="p-text"></div>
        <dl class="p-specs" id="p-specs"></dl>
      </div>
    </aside>
    <main id="sections">
      <h1 class="sr" id="h1"></h1>
    </main>
  </div>
</div>

<script src="../assets/base.js"></script>
<!-- ABOUT BUILDER. Reads the PAGE block above. No need to edit. -->
<script>
(function(){
  try {
    var C = PAGE, root = C.root || '';
    function $(id){ return document.getElementById(id); }
    function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

    document.title = C.browserTitle;
    $('h1').textContent = C.heading;
    if (C.sideTab) $('tab-side').textContent = C.sideTab;
    else { $('tabs-side').remove(); document.querySelector('.page').classList.add('no-tabs'); }

    // panel image: shown only once loaded (a missing file keeps the dotted frame)
    var img = $('p-img'); img.hidden = true;
    if (C.showImage === false) $('frame').remove();
    else if (C.image) {
      if (C.imageOnPaper) $('frame').classList.add('paper'); var probe = new Image(); probe.onload = function(){ img.src = probe.src; img.hidden = false; }; probe.src = root + C.image;
    }

    (C.text || []).forEach(function(t){ var p = el('p', 'p-text'); p.innerHTML = t; $('p-text').appendChild(p); });
    var info = (C.info || []).filter(function(r){ return r[1]; });
    info.forEach(function(r){ $('p-specs').appendChild(el('dt', null, r[0])); $('p-specs').appendChild(el('dd', null, r[1])); });
    $('p-specs').hidden = !info.length;
    if (!(C.text || []).length && !info.length && !((typeof SITE !== 'undefined' && SITE.contact) || []).length && C.showImage === false) $('preview').hidden = true;

    // ---- contact: from "contact" in assets/site.js; hover a line and the panel shows it ----
    var S = (typeof SITE !== 'undefined') ? SITE : {}, contacts = S.contact || [];
    function isMail(c){ return /^email$/i.test(c.channel) || /@/.test(c.link) && !/^https?:/.test(c.link); }
    function href(c){ return !c.link ? '' : isMail(c) ? 'mailto:' + c.link.replace(/^mailto:/, '') : c.link; }
    // copy: clipboard where the browser allows it, otherwise the address is selected for the visitor to copy
    function copy(text, btn, dd){
      var done = function(){ btn.textContent = C.copiedLabel; setTimeout(function(){ btn.textContent = C.copyLabel; }, 1600); };
      var select = function(){ var r = document.createRange(); r.selectNodeContents(dd); var s = getSelection(); s.removeAllRanges(); s.addRange(r); };
      try { navigator.clipboard.writeText(text).then(done, select); } catch (e) { select(); }
    }
    // every contact line in the panel, each with its own Copy / Write or Open
    var box = $('c-specs'); box.textContent = '';
    contacts.forEach(function(c){
      box.appendChild(el('dt', null, c.channel));
      var dd = el('dd', null, c.value), h = href(c), acts = el('span', 'acts');
      box.appendChild(dd);
      if (h && isMail(c)) {
        var b = el('button', 'ql', C.copyLabel); b.type = 'button';
        b.addEventListener('click', function(){ copy(c.link.replace(/^mailto:/, ''), b, dd); });
        acts.appendChild(b);
        var w = el('a', 'ql', C.writeLabel + ' ↗'); w.href = h; acts.appendChild(w);
      } else if (h) {
        var o = el('a', 'ql', C.openLabel + ' ↗'); o.href = h; o.target = '_blank'; o.rel = 'noopener'; acts.appendChild(o);
      }
      if (acts.children.length) { box.appendChild(el('dt')); var ad = el('dd', 'act'); ad.appendChild(acts); box.appendChild(ad); }
      if (c.note) { box.appendChild(el('dt')); box.appendChild(el('dd', 'c-note', c.note)); }
    });
    box.hidden = !contacts.length;

    (C.sections || []).forEach(function(sec){
      var cols = sec.columns || [], cv = cols.length > 3, t = el('table', cv ? 'read cv' : 'read'), head = el('thead'), hr = el('tr'), body = el('tbody');
      if (sec.heading) t.appendChild(el('caption', 'sec', sec.heading));
      cols.forEach(function(c){ var th = el('th', null, c); th.scope = 'col'; hr.appendChild(th); });
      head.appendChild(hr); if (sec.showColumns !== false) t.appendChild(head);
      (sec.rows || []).forEach(function(r){
        var tr = el('tr');
        cols.forEach(function(c, i){
          var cls = /^year$/i.test(c) ? 'yr' : (i === 0 ? 't' : (i === 1 && /^year$/i.test(cols[0]) ? 't' : null));
          var v = r[i], td = el('td', cls);
          if (Array.isArray(v)) { td.appendChild(document.createTextNode(v[0] || '')); if (v[1]) td.appendChild(el('span', 'l2', v[1])); }
          else td.textContent = v || '';
          tr.appendChild(td);
        });
        // phones: the venue column is hidden, so its name and place are repeated under the title
        if (cv && r[2] && tr.children[1]) { var vv = Array.isArray(r[2]) ? r[2].filter(Boolean).join(', ') : r[2]; tr.children[1].appendChild(el('span', 'l2 venue', vv)); }
        body.appendChild(tr);
      });
      t.appendChild(body);
      $('sections').appendChild(t);
    });
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', '<p style="padding:12px;font:14px monospace">Content error: check the quotation marks and commas in the content block at the top of the file.</p>');
  }
})();
</script>
</body>
</html>
