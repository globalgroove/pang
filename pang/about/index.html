<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- =====================================================================
     ABOUT PAGE  (about/index.html)
     CONTENT BLOCK  -  THIS IS THE ONLY PART YOU NEED TO EDIT HERE
     =====================================================================
     Left: the dark panel with an optional square image, short text and info lines.
     Right: one table per section (Services, CV ...). Add, remove or reorder
     sections freely; each row is a list of cells, one per column.

     Rules:
       - Keep the quotation marks "like this" and the commas at line ends.
       - A quotation mark inside a value needs a backslash: "12\" LP"
       - Paragraphs may contain simple HTML, e.g. <em>italic</em>.
       - A column named "Year" is set in the mono face, like the other lists.
     ===================================================================== -->
<script>
const PAGE = {

  root: "../",                   // path back to the site root (one folder down)

  browserTitle: "About — pang",
  sideTab: "ABOUT",              // text in the black box on the right edge. "" hides it
  heading: "About",              // hidden heading, for screen readers

  image: "",                     // optional square image in the panel, relative to the site root,
                                 // e.g. "id/about.jpg". "" = dotted placeholder. Set showImage: false to drop the frame
  showImage: true,

  /* ---- PANEL TEXT: list of paragraphs, [] hides it ------------------ */
  text: [],

  /* ---- PANEL INFO LINES:  [ "label", "value" ]. [] hides them -------- */
  info: [
    ["Based in", ""],
    ["Languages", ""]
  ],

  /* ---- SECTIONS (right column) --------------------------------------- */
  /*   heading : small title above the table                             */
  /*   columns : column headings, left to right                          */
  /*   rows    : one [ ... ] per line, same number of cells as columns   */
  sections: [
    {
      heading: "Services",
      columns: ["Service", "Scope"],
      rows: [
        ["Recording", ""],
        ["Mixing", ""],
        ["Music production", ""],
        ["Composition", ""],
        ["Sound design", ""],
        ["Sound devices for stage", ""],
        ["Exhibition sound integration", ""],
        ["Dramaturgy and consulting", ""]
      ]
    },
    {
      heading: "CV",
      columns: ["Year", "Activity", "Context"],
      rows: [
        ["2026", "", ""]
      ]
    }
  ]
};
</script>
<!-- ===================== END OF CONTENT BLOCK ===================== -->

<title>About — pang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/base.css">
<link rel="stylesheet" href="../assets/list.css">
<script src="../assets/site.js"></script>
<style>
/* about page only: square frame, narrower panel, wider list. Type comes from assets/list.css */
:root{--frame-ratio:1/1}
.cols{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
/* the tables here are for reading: no pointer, no highlighted rows */
tbody tr{cursor:default}
tbody tr:hover,tbody tr:focus-within{background:none;color:inherit}
tbody tr:hover td,tbody tr:focus-within td{border-bottom-color:var(--row-line)}
table + table{margin-top:36px}
/* section title above each table, in the face of the Discography and Work headings */
caption.sec{caption-side:top;text-align:left;padding:0 8px 10px;font:500 calc(var(--list-size) + 1px)/1.3 var(--list-sans);letter-spacing:.16em;text-transform:uppercase}
thead th{opacity:.55}
td.t{width:16em}
/* phones: the panel stays, above the tables */
@media (max-width:760px){
  .preview{display:block;position:static;margin-bottom:28px;max-width:420px}
  td.t{width:auto}
}
</style>
</head>
<body>
<div class="page" id="top">

  <nav class="site" id="site"></nav>
  <div class="tabs-side" id="tabs-side"><div class="tab-side" id="tab-side" aria-hidden="true"></div></div>

  <!-- two columns: panel on the left, sections on the right -->
  <div class="cols">
    <aside class="preview" id="preview">
      <div class="frame" id="frame"><img id="p-img" alt=""></div>
      <div class="body">
        <div id="p-text"></div>
        <dl class="p-specs" id="p-specs"></dl>
      </div>
    </aside>
    <main id="sections">
      <h1 class="sr" id="h1"></h1>
    </main>
  </div>
</div>

<script src="../assets/base.js"></script>
<!-- ABOUT BUILDER. Reads the PAGE block above. No need to edit. -->
<script>
(function(){
  try {
    var C = PAGE, root = C.root || '';
    function $(id){ return document.getElementById(id); }
    function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }

    document.title = C.browserTitle;
    $('h1').textContent = C.heading;
    if (C.sideTab) $('tab-side').textContent = C.sideTab;
    else { $('tabs-side').remove(); document.querySelector('.page').classList.add('no-tabs'); }

    // panel image: shown only once loaded (a missing file keeps the dotted frame)
    var img = $('p-img'); img.hidden = true;
    if (C.showImage === false) $('frame').remove();
    else if (C.image) { var probe = new Image(); probe.onload = function(){ img.src = probe.src; img.hidden = false; }; probe.src = root + C.image; }

    (C.text || []).forEach(function(t){ var p = el('p', 'p-text'); p.innerHTML = t; $('p-text').appendChild(p); });
    var info = (C.info || []).filter(function(r){ return r[1]; });
    info.forEach(function(r){ $('p-specs').appendChild(el('dt', null, r[0])); $('p-specs').appendChild(el('dd', null, r[1])); });
    $('p-specs').hidden = !info.length;
    if (!(C.text || []).length && !info.length && C.showImage === false) $('preview').hidden = true;

    (C.sections || []).forEach(function(sec){
      var cols = sec.columns || [], t = el('table'), head = el('thead'), hr = el('tr'), body = el('tbody');
      if (sec.heading) t.appendChild(el('caption', 'sec', sec.heading));
      cols.forEach(function(c){ var th = el('th', null, c); th.scope = 'col'; hr.appendChild(th); });
      head.appendChild(hr); t.appendChild(head);
      (sec.rows || []).forEach(function(r){
        var tr = el('tr');
        cols.forEach(function(c, i){
          var cls = /^year$/i.test(c) ? 'yr' : (i === 0 ? 't' : (i === 1 && /^year$/i.test(cols[0]) ? 't' : null));
          tr.appendChild(el('td', cls, r[i] || ''));
        });
        body.appendChild(tr);
      });
      t.appendChild(body);
      $('sections').appendChild(t);
    });
  } catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('afterbegin', '<p style="padding:12px;font:14px monospace">Content error: check the quotation marks and commas in the content block at the top of the file.</p>');
  }
})();
</script>
</body>
</html>
